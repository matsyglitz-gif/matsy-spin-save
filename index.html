<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matsy.glitz — Spin & Save</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f1e7;
      color: #123d32;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 480px;
      padding: 28px 18px 40px;
      text-align: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #7d2634;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 42px;
      margin: 18px 0 5px;
    }

    .intro {
      font-size: 14px;
      line-height: 1.5;
      margin: 0 auto 24px;
      max-width: 340px;
    }

    .code-box {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(18, 61, 50, 0.08);
      margin-bottom: 25px;
    }

    .code-box label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6c8b5;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      text-transform: uppercase;
      outline: none;
    }

    .wheel-wrap {
      position: relative;
      width: min(86vw, 350px);
      height: min(86vw, 350px);
      margin: 20px auto 25px;
    }

    .pointer {
      position: absolute;
      z-index: 5;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid #7d2634;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #b08a4a;
      background:
        conic-gradient(
          #123d32 0deg 51.43deg,
          #e9c8c7 51.43deg 102.86deg,
          #7d2634 102.86deg 154.29deg,
          #f7dca8 154.29deg 205.72deg,
          #123d32 205.72deg 257.15deg,
          #e9c8c7 257.15deg 308.58deg,
          #7d2634 308.58deg 360deg
        );
      position: relative;
      transition: transform 4s cubic-bezier(.17,.67,.12,.99);
      box-shadow: 0 10px 30px rgba(18,61,50,.15);
    }

    .wheel::after {
      content: "M";
      position: absolute;
      width: 72px;
      height: 72px;
      background: #f7f1e7;
      border: 4px solid #b08a4a;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: bold;
      color: #123d32;
    }

    .spin-button {
      border: none;
      background: #7d2634;
      color: white;
      padding: 15px 38px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(125,38,52,.2);
    }

    .spin-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      min-height: 24px;
      margin-top: 15px;
      font-size: 13px;
    }

    .result {
      display: none;
      background: white;
      border: 1px solid #d8c8b3;
      border-radius: 18px;
      padding: 22px;
      margin-top: 25px;
    }

    .result.show {
      display: block;
    }

    .result h2 {
      font-family: Georgia, serif;
      color: #7d2634;
      margin-top: 0;
    }

    .result-text {
      font-size: 26px;
      font-weight: bold;
      margin: 12px 0;
    }

    .small {
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 35px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #6d665d;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">Matsy.glitz</div>

    <div class="subtitle">CLEARANCE GAME</div>

    <h1>SPIN & SAVE</h1>

    <p class="intro">
      Your favourite pieces. Now at even better prices.
      Enter your unique code and see what you get. 👀
    </p>

    <div class="code-box">
      <label for="code">ENTER YOUR UNIQUE CODE</label>
      <input
        id="code"
        type="text"
        placeholder="MATSY001"
        maxlength="20"
      >
    </div>

    <div class="wheel-wrap">

      <div class="pointer"></div>

      <div class="wheel" id="wheel"></div>

    </div>

    <button class="spin-button" id="spinButton" onclick="spin()">
      SPIN NOW 🎡
    </button>

    <div class="message" id="message"></div>

    <div class="result" id="result">

      <h2>YOU GOT...</h2>

      <div class="result-text" id="resultText"></div>

      <p class="small">
        Screenshot this result and send it to Matsy.glitz
        on WhatsApp when placing your order.
      </p>

    </div>

    <div class="footer">
      ONE CUSTOMER • ONE SPIN • ONE CODE
    </div>

  </main>


  <script>

    const outcomes = [
      "KSh 50 OFF",
      "KSh 75 OFF",
      "KSh 100 OFF",
      "KSh 120 OFF",
      "KSh 150 OFF",
      "FREE GIFT",
      "OOPS! GOOD LUCK NEXT TIME 😉"
    ];

    let spinning = false;
    let rotation = 0;

    function spin() {

      if (spinning) return;

      const code = document
        .getElementById("code")
        .value
        .trim()
        .toUpperCase();

      const message = document.getElementById("message");

      if (!code) {
        message.textContent = "Please enter your unique code first. 💕";
        return;
      }

      spinning = true;

      document.getElementById("spinButton").disabled = true;
      message.textContent = "Spinning... 👀";

      /*
        TEMPORARY RESULT SELECTION

        We will replace this with the secure
        Supabase/Vercel system next.
      */

      const resultIndex =
        Math.floor(Math.random() * outcomes.length);

      const segmentAngle = 360 / outcomes.length;

      const targetAngle =
        360 - (resultIndex * segmentAngle + segmentAngle / 2);

      rotation += 360 * 6 + targetAngle;

      document.getElementById("wheel").style.transform =
        `rotate(${rotation}deg)`;

      setTimeout(() => {

        document.getElementById("resultText").textContent =
          outcomes[resultIndex];

        document.getElementById("result").classList.add("show");

        message.textContent =
          "That's your result! 🎉";

      }, 4300);
    }

  </script>

</body>
</html>
